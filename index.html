<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contas da Mãe</title>
<style>
  :root {
    --bg: #faf7f2; --panel: #ffffff; --fg: #2b2622; --muted: #7a6f66; --line: #ece5dc;
    --ok: #2f7d4f; --bad: #c0392b; --warn: #b7791f; --muted-bar: #d9d1c7; --hero: #fbf1e1;
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1a17; --panel: #26221e; --fg: #f3ede6; --muted: #b3a89c; --line: #3a342e;
      --ok: #5fbf86; --bad: #ef7a6c; --warn: #e3b25d; --muted-bar: #4a433c; --hero: #2e2820; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
  h1, .num, .big { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }
  /* Tela de senha */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .gate form { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 32px 24px; width: min(100%, 360px); display: flex; flex-direction: column; gap: 14px; text-align: center; }
  .gate h1 { margin: 0; font-size: 1.8rem; }
  .gate p { margin: 0; color: var(--muted); }
  .gate input { font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); text-align: center; letter-spacing: .08em; }
  .gate button { font: inherit; padding: 12px; border: 0; border-radius: 12px; background: var(--fg); color: var(--bg); cursor: pointer; }
  .gate .erro { color: var(--bad); min-height: 1.5em; font-size: .9rem; }
  /* Painel */
  .hero { background: var(--hero); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 22px; }
  .hero .oi { font-size: .85rem; color: var(--muted); }
  .hero h1 { margin: 4px 0 8px; font-size: 2.1rem; }
  .hero p { margin: 0; font-size: 1.05rem; max-width: 60ch; }
  .hero b { font-weight: 600; } .hero b.bad { color: var(--bad); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs button { font: inherit; font-size: .95rem; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .page { display: flex; flex-direction: column; gap: 20px; } .page[hidden] { display: none; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .tile { display: flex; flex-direction: column; gap: 4px; }
  .tile .ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--tone, var(--muted)) 15%, transparent); font-size: 1.05rem; }
  .tile .lbl { font-size: .9rem; color: var(--muted); margin-top: 6px; }
  .tile .num { font-size: 1.9rem; color: var(--tone, var(--fg)); font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: .8rem; color: var(--muted); }
  .t-ok { --tone: var(--ok); } .t-bad { --tone: var(--bad); } .t-warn { --tone: var(--warn); }
  h2 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
  .note { font-size: .9rem; color: var(--muted); margin: 0 0 14px; }
  .aviso { border-radius: var(--radius); padding: 16px 20px; border: 1px solid var(--line); font-size: 1rem; }
  .aviso b, .hero b { white-space: nowrap; }
  .aviso.bad { background: color-mix(in srgb, var(--bad) 9%, var(--panel)); }
  .aviso.ok { background: color-mix(in srgb, var(--ok) 9%, var(--panel)); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
  .filtro { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .95rem; }
  .filtro select { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--fg); }
  .scroll { max-height: 30rem; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 500; font-size: .8rem; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .r { text-align: right; } .neg { color: var(--bad); font-weight: 600; } .pos { color: var(--ok); }
  .vazio { color: var(--muted); text-align: center; padding: 20px; }
  .obs { display: block; font-size: .8rem; color: var(--muted); }
  .pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .8rem; white-space: nowrap; }
  .pill.atrasada { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }
  .pill.paga { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
  .pill.avencer, .pill.aconfirmar { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.12); padding: 6px 10px; font-size: .8rem; white-space: nowrap; display: none; z-index: 2; }
  .tip .d { color: var(--muted); }
  .rodape { font-size: .8rem; color: var(--muted); text-align: center; }
  .rodape button { font: inherit; background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; }
  .only-narrow { display: none; }
  @media (max-width: 520px) { .hide-narrow { display: none; } .only-narrow { display: inline-block; margin-top: 4px; } td, th { padding-left: 6px; padding-right: 6px; } .hero h1 { font-size: 1.7rem; } }
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="form-senha" autocomplete="off">
    <div style="font-size:2rem" aria-hidden="true">🏠</div>
    <h1>Contas da Mãe</h1>
    <p>Digite a senha para ver as contas.</p>
    <input id="senha" type="password" inputmode="text" aria-label="Senha" placeholder="Senha" required>
    <button type="submit">Entrar</button>
    <div class="erro" id="erro" role="alert"></div>
  </form>
</div>

<script>
(() => {
  const P = JSON.parse(document.getElementById('payload').textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function abrir(senha) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    const chave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const txt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, chave, b64(P.ct));
    return JSON.parse(new TextDecoder().decode(txt));
  }
  const form = document.getElementById('form-senha');
  const erro = document.getElementById('erro');
  async function tentar(senha, lembrar) {
    try {
      const dados = await abrir(senha);
      if (lembrar) { try { sessionStorage.setItem('cm-s', senha); } catch (e) {} }
      document.getElementById('gate').remove();
      montar(dados);
    } catch (e) { erro.textContent = 'Senha incorreta. Tente de novo.'; }
  }
  form.addEventListener('submit', (ev) => { ev.preventDefault(); erro.textContent = 'Abrindo…'; tentar(document.getElementById('senha').value.trim(), true); });
  try { const s = sessionStorage.getItem('cm-s'); if (s) tentar(s, false); } catch (e) {}

  // ---------- Painel ----------
  const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const brl0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  const mesDe = (s) => { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s || ''); return m ? m[2] + '/' + m[3] : null; };
  const iso = (s) => { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s || ''); return m ? `${m[3]}-${m[2]}-${m[1]}` : '9999'; };
  const ordemMes = (m) => (m === 'Todos' ? '0' : m === 'Sem data' ? '9999' : m.slice(3) + '-' + m.slice(0, 2));
  const nomeMes = ['', 'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const rotuloMes = (m) => (m === 'Todos' ? 'todos os meses' : m === 'Sem data' ? 'sem data' : `${nomeMes[+m.slice(0, 2)]} de ${m.slice(3)}`);
  const pillClasse = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s/g, '');
  const el = (tag, attrs = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else e.setAttribute(k, v); }
    kids.flat().forEach((k) => e.append(k));
    return e;
  };
  const NS = 'http://www.w3.org/2000/svg';
  const s = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
  const ticks = (lo, hi, n = 4) => {
    const span = hi - lo || 1; const step0 = span / n; const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((x) => x >= step0);
    const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step; const out = [];
    for (let v = a; v <= b + step / 2; v += step) out.push(Math.round(v * 100) / 100);
    return out;
  };
  const medir = (svg, txt) => { const t = s('text', { 'font-size': 12 }); t.textContent = txt; svg.append(t); const w = t.getComputedTextLength(); t.remove(); return w; };

  function montar(D) {
    const app = document.getElementById('app');
    app.hidden = false;
    const r = Object.fromEntries(D.resumo.map((x) => [x.indicador, x.valor]));
    const base = Object.fromEntries(D.base.map((x) => [x.indicador, x.valor]));

    // Cabeçalho
    app.append(el('header', { class: 'hero' },
      el('div', { class: 'oi', text: 'Acompanhamento da casa' }),
      el('h1', { text: 'Contas da Mãe' }),
      el('p', {}, 'Hoje há ', el('b', { text: brl.format(base['Pendências em aberto hoje'] || 0) }), ' em contas ainda não pagas, sendo ',
        el('b', { class: 'bad', text: brl.format(r['Em atraso (acumulado)'] || 0) }), ' já vencidos.')
    ));

    const abas = [['geral', 'Resumo'], ['projecao', 'Próximos meses'], ['pagos', 'Pagos'], ['pendentes', 'Pendentes']];
    const nav = el('nav', { class: 'tabs', role: 'tablist' });
    const paginas = {};
    abas.forEach(([id, nome], i) => {
      const b = el('button', { role: 'tab', 'aria-selected': String(i === 0), text: nome });
      b.addEventListener('click', () => mostrar(id));
      nav.append(b);
      paginas[id] = { botao: b, sec: el('section', { class: 'page', id }) };
      if (i) paginas[id].sec.hidden = true;
    });
    app.append(nav, ...Object.values(paginas).map((p) => p.sec));
    const desenhos = {};
    function mostrar(id) {
      Object.entries(paginas).forEach(([k, p]) => { p.sec.hidden = k !== id; p.botao.setAttribute('aria-selected', String(k === id)); });
      if (desenhos[id]) desenhos[id]();
      history.replaceState(null, '', '#' + id);
    }

    const tile = (tom, ic, lbl, num, sub) => el('div', { class: 'card tile ' + tom }, el('div', { class: 'ic', 'aria-hidden': 'true', text: ic }), el('div', { class: 'lbl', text: lbl }), el('div', { class: 'num', text: num }), sub ? el('div', { class: 'sub', text: sub }) : '');

    // ---- Resumo
    const mesRef = rotuloMes(D.mes_ref);
    paginas.geral.sec.append(
      el('div', { class: 'tiles' },
        tile('t-ok', '💰', `Recebido em ${mesRef}`, brl.format(r['Recebido neste mês'] || 0), 'Salário e outras entradas'),
        tile('', '✔️', `Pago em ${mesRef}`, brl.format(r['Pago neste mês'] || 0), 'Contas quitadas no mês'),
        tile('t-bad', '⚠️', 'Ficou para trás', brl.format(r['Em atraso (acumulado)'] || 0), 'Venceu e ainda não foi pago'),
        tile('t-warn', '📅', 'A vencer', brl.format(r['A vencer'] || 0), 'Próximas contas já lançadas')),
      (() => {
        const box = el('div', { class: 'chart' });
        desenhos.geral = () => graficoBarras(box, D.mensal);
        return el('div', { class: 'card' }, el('h2', { text: 'Como foi cada mês' }), el('p', { class: 'note', text: 'Contas de cada mês, pelo vencimento. Toque ou passe o mouse sobre a barra para ver os valores.' }),
          el('div', { class: 'legend' }, legenda('var(--ok)', 'Pago'), legenda('var(--bad)', 'Em atraso'), legenda('var(--muted-bar)', 'A vencer')), box);
      })()
    );

    // ---- Próximos meses
    const p0 = D.projecao[0] || {}; const pf = D.projecao[D.projecao.length - 1] || {};
    const neg = (p0.saldo || 0) < 0;
    const box2 = el('div', { class: 'chart' });
    desenhos.projecao = () => graficoLinha(box2, D.projecao);
    const tProj = el('tbody');
    D.projecao.forEach((l) => tProj.append(el('tr', {},
      el('td', { text: l.mes }), el('td', { class: 'r hide-narrow', text: brl.format(l.receita || 0) }), el('td', { class: 'r', text: brl.format(l.total || 0) }),
      el('td', { class: 'r ' + ((l.saldo || 0) < 0 ? 'neg' : 'pos'), text: brl.format(l.saldo || 0) }),
      el('td', { class: 'r ' + ((l.acumulado || 0) < 0 ? 'neg' : 'pos'), text: brl.format(l.acumulado || 0) }))));
    const tFix = el('tbody'), tVar = el('tbody');
    D.orcamento.forEach((l) => {
      if (l.tipo === 'Fixa') tFix.append(el('tr', {}, el('td', {}, l.conta, l.observacao ? el('span', { class: 'obs', text: l.observacao }) : ''), el('td', { class: 'hide-narrow', text: l.termina || 'Sem fim' }), el('td', { class: 'r', text: brl.format(l.valor || 0) })));
      else tVar.append(el('tr', {}, el('td', { text: l.conta }), el('td', { class: 'r', text: brl.format(l.valor || 0) })));
    });
    paginas.projecao.sec.append(
      el('div', { class: 'aviso ' + (neg ? 'bad' : 'ok') }, 'Recebendo ', el('b', { text: brl.format(p0.receita || 0) }), ' por mês e com ', el('b', { text: brl.format(p0.total || 0) }),
        ' em contas previstas, o saldo de cada mês fica em ', el('b', { text: brl.format(p0.saldo || 0) }), '. ',
        neg ? 'Ou seja, as contas previstas passam do que entra.' : 'Ou seja, o que entra cobre as contas previstas.'),
      el('div', { class: 'tiles' },
        tile('t-ok', '💰', 'Receita prevista por mês', brl.format(base['Receita prevista por mês'] || 0), 'Igual ao último mês recebido'),
        tile('', '🏠', 'Contas fixas', brl.format(p0.fixas || 0), 'Valor do próximo mês'),
        tile('t-warn', '💡', 'Contas variáveis (estimadas)', brl.format(p0.variaveis || 0), 'Água, luz, gás e internet'),
        tile((pf.acumulado || 0) < 0 ? 't-bad' : 't-ok', '📉', `Saldo acumulado até ${pf.mes || ''}`, brl.format(pf.acumulado || 0), 'Já descontando as pendências de hoje')),
      el('div', { class: 'card' }, el('h2', { text: 'Para onde o saldo vai' }), el('p', { class: 'note', text: 'Saldo acumulado mês a mês, começando pelas contas em aberto hoje. Abaixo da linha do zero, falta dinheiro.' }), box2),
      el('div', { class: 'card' }, el('h2', { text: 'Mês a mês previsto' }), el('div', { class: 'scroll' }, el('table', {},
        el('thead', {}, el('tr', {}, el('th', { text: 'Mês' }), el('th', { class: 'r hide-narrow', text: 'Receita' }), el('th', { class: 'r', text: 'Contas' }), el('th', { class: 'r', text: 'Saldo do mês' }), el('th', { class: 'r', text: 'Acumulado' }))), tProj))),
      el('div', { class: 'grid2' },
        el('div', { class: 'card' }, el('h2', { text: 'Contas fixas' }), el('p', { class: 'note', text: 'Mudam pouco de um mês para o outro.' }),
          el('table', {}, el('thead', {}, el('tr', {}, el('th', { text: 'Conta' }), el('th', { class: 'hide-narrow', text: 'Até' }), el('th', { class: 'r', text: 'Por mês' }))), tFix)),
        el('div', { class: 'card' }, el('h2', { text: 'Contas variáveis' }), el('p', { class: 'note', text: 'Valores estimados; o real pode variar.' }),
          el('table', {}, el('thead', {}, el('tr', {}, el('th', { text: 'Conta' }), el('th', { class: 'r', text: 'Estimativa' }))), tVar)))
    );

    // ---- Pagos e Pendentes
    lista(paginas.pagos.sec, D.contas, 'pago');
    lista(paginas.pendentes.sec, D.contas, 'pendente');

    app.append(el('p', { class: 'rodape' }, `Dados atualizados em ${D.atualizado_em}. `, (() => { const b = el('button', { type: 'button', text: 'Sair' }); b.addEventListener('click', () => { try { sessionStorage.removeItem('cm-s'); } catch (e) {} location.reload(); }); return b; })()));

    const h = location.hash.slice(1);
    mostrar(paginas[h] ? h : 'geral');
    let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { const ativo = Object.keys(paginas).find((k) => !paginas[k].sec.hidden); if (desenhos[ativo]) desenhos[ativo](); }, 150); });
  }

  function legenda(cor, nome) { const sp = el('span'); const i = el('i'); i.style.background = cor; sp.append(i, nome); return sp; }

  function lista(sec, contas, tipo) {
    const ehPago = tipo === 'pago';
    const sel = el('select', { 'aria-label': ehPago ? 'Mês do pagamento' : 'Mês do vencimento' });
    const set = new Set(['Todos']);
    contas.forEach((l) => { const pago = l.situacao === 'Paga'; if (ehPago === pago) set.add(mesDe(ehPago ? l.pago_em : l.vencimento) || 'Sem data'); });
    const opcoes = [...set].sort((a, b) => ordemMes(a).localeCompare(ordemMes(b)));
    opcoes.forEach((o) => sel.append(new Option(rotuloMes(o), o)));
    const reais = opcoes.filter((o) => o !== 'Todos' && o !== 'Sem data');
    sel.value = ehPago ? (reais[reais.length - 1] || 'Todos') : 'Todos';
    const nTotal = el('div', { class: 'num' }), nQtd = el('div', { class: 'num' }), nSub = el('div', { class: 'sub' });
    const corpo = el('tbody');
    const cols = ehPago ? 4 : 5;
    const ordem = { 'Atrasada': 0, 'A confirmar': 1, 'A vencer': 2 };
    function render() {
      const mes = sel.value;
      const doMes = (l) => mes === 'Todos' || (mesDe(ehPago ? l.pago_em : l.vencimento) || 'Sem data') === mes;
      let linhas = contas.filter((l) => (ehPago ? l.situacao === 'Paga' : l.situacao !== 'Paga') && doMes(l));
      linhas = ehPago
        ? linhas.sort((a, b) => iso(a.pago_em).localeCompare(iso(b.pago_em)) || a.conta.localeCompare(b.conta))
        : linhas.sort((a, b) => (ordem[a.situacao] ?? 3) - (ordem[b.situacao] ?? 3) || iso(a.vencimento).localeCompare(iso(b.vencimento)));
      const total = Math.round(linhas.reduce((a, l) => a + (l.valor || 0), 0) * 100) / 100;
      const semValor = linhas.filter((l) => l.valor == null).length;
      nTotal.textContent = brl.format(total); nQtd.textContent = String(linhas.length);
      nSub.textContent = !ehPago && semValor ? `inclui ${semValor} conta(s) com valor a confirmar` : '';
      corpo.replaceChildren();
      if (!linhas.length) { const td = el('td', { class: 'vazio', text: ehPago ? 'Nenhum pagamento neste mês.' : 'Tudo em dia neste mês. 🎉' }); td.colSpan = cols; corpo.append(el('tr', {}, td)); return; }
      linhas.forEach((l) => {
        const pillN = !ehPago ? el('span', { class: 'pill only-narrow ' + pillClasse(l.situacao), text: l.situacao || '—' }) : '';
        const tr = el('tr', {}, el('td', {}, l.conta, l.observacao ? el('span', { class: 'obs', text: l.observacao }) : '', pillN ? el('br') : '', pillN),
          el('td', { class: 'hide-narrow', text: l.referencia || '—' }), el('td', { text: (ehPago ? l.pago_em : l.vencimento) || '—' }),
          el('td', { class: 'r', text: l.valor == null ? '—' : brl.format(l.valor) }));
        if (!ehPago) tr.append(el('td', { class: 'hide-narrow' }, el('span', { class: 'pill ' + pillClasse(l.situacao), text: l.situacao || '—' })));
        corpo.append(tr);
      });
    }
    sel.addEventListener('change', render);
    const head = ehPago
      ? ['Conta', ['Mês ref.', 'hide-narrow'], 'Pago em', ['Valor', 'r']]
      : ['Conta', ['Mês ref.', 'hide-narrow'], 'Vencimento', ['Valor', 'r'], ['Situação', 'hide-narrow']];
    sec.append(
      el('label', { class: 'filtro' }, ehPago ? 'Mostrar pagamentos de ' : 'Mostrar contas que vencem em ', sel),
      el('div', { class: 'tiles' },
        el('div', { class: 'card tile ' + (ehPago ? 't-ok' : 't-bad') }, el('div', { class: 'ic', 'aria-hidden': 'true', text: ehPago ? '✔️' : '⏳' }), el('div', { class: 'lbl', text: ehPago ? 'Total pago' : 'Total pendente' }), nTotal, nSub),
        el('div', { class: 'card tile' }, el('div', { class: 'ic', 'aria-hidden': 'true', text: '🧾' }), el('div', { class: 'lbl', text: ehPago ? 'Contas pagas' : 'Contas pendentes' }), nQtd)),
      el('div', { class: 'card' }, el('h2', { text: ehPago ? 'O que já foi pago' : 'O que falta pagar' }),
        el('p', { class: 'note', text: ehPago ? 'Em ordem de data do pagamento.' : 'Atrasadas primeiro, depois pela data de vencimento.' }),
        el('div', { class: 'scroll' }, el('table', {}, el('thead', {}, el('tr', {}, head.map((h) => Array.isArray(h) ? el('th', { class: h[1], text: h[0] }) : el('th', { text: h })))), corpo)))
    );
    render();
  }

  function tooltip(box, svg, W, H, pontos, linhasDe) {
    const tip = el('div', { class: 'tip' }); box.append(tip);
    pontos.forEach(({ x, w, d }) => {
      const r = s('rect', { x, y: 0, width: w, height: H - 24, fill: 'transparent' });
      const show = (ev) => {
        tip.replaceChildren(el('div', { class: 'd', text: d.mes }), ...linhasDe(d).map(([n, v]) => el('div', { text: `${n}: ${brl.format(v || 0)}` })));
        tip.style.display = 'block';
        const rect = box.getBoundingClientRect();
        const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
        tip.style.left = Math.min(Math.max(0, px + 12), box.clientWidth - tip.offsetWidth) + 'px';
        tip.style.top = Math.max(0, py - 10) + 'px';
      };
      r.addEventListener('mousemove', show); r.addEventListener('click', show);
      r.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
      svg.append(r);
    });
  }

  function graficoBarras(box, rows) {
    box.replaceChildren();
    const W = Math.max(280, box.clientWidth), H = 240;
    const svg = s('svg', { viewBox: `0 0 ${W} ${H}` }); box.append(svg);
    rows = rows.map((d) => ({ ...d, aberto: Math.max(0, (d.contas || 0) - (d.pago || 0) - (d.em_atraso || 0)) }));
    const max = Math.max(1, ...rows.map((d) => d.contas || 0));
    const tk = ticks(0, max); const top = tk[tk.length - 1];
    const left = Math.ceil(Math.max(...tk.map((t) => medir(svg, brl0.format(t))))) + 10;
    const y = (v) => (H - 28) - (v / top) * (H - 28 - 12);
    const step = (W - 4 - left) / rows.length, bw = step * 0.7;
    tk.forEach((t) => { svg.append(s('line', { x1: left, x2: W - 4, y1: y(t), y2: y(t), stroke: 'var(--line)' })); const tx = s('text', { x: left - 6, y: y(t), dy: '0.32em', 'text-anchor': 'end', fill: 'var(--muted)', 'font-size': 12 }); tx.textContent = brl0.format(t); svg.append(tx); });
    const every = Math.max(1, Math.ceil(72 / step));
    const pontos = [];
    rows.forEach((d, i) => {
      const x0 = left + i * step + (step - bw) / 2; let base = 0;
      [['pago', 'var(--ok)'], ['em_atraso', 'var(--bad)'], ['aberto', 'var(--muted-bar)']].forEach(([k, cor]) => {
        const v = d[k] || 0; if (!v) return;
        svg.append(s('rect', { x: x0, width: bw, y: y(base + v), height: Math.max(0, y(base) - y(base + v)), fill: cor, rx: 4 })); base += v;
      });
      if (i % every === 0) { const tx = s('text', { x: x0 + bw / 2, y: H - 8, 'text-anchor': 'middle', fill: 'var(--muted)', 'font-size': 12 }); tx.textContent = d.mes; svg.append(tx); }
      pontos.push({ x: left + i * step, w: step, d });
    });
    tooltip(box, svg, W, H, pontos, (d) => [['Recebido', d.recebido], ['Contas do mês', d.contas], ['Pago', d.pago], ['Em atraso', d.em_atraso], ['Atraso acumulado', d.acumulado]]);
  }

  function graficoLinha(box, rows) {
    box.replaceChildren();
    const W = Math.max(280, box.clientWidth), H = 240;
    const svg = s('svg', { viewBox: `0 0 ${W} ${H}` }); box.append(svg);
    const vals = rows.map((d) => d.acumulado || 0);
    const tk = ticks(Math.min(0, ...vals), Math.max(0, ...vals)); const lo = tk[0], hi = tk[tk.length - 1];
    const left = Math.ceil(Math.max(...tk.map((t) => medir(svg, brl0.format(t))))) + 10;
    const y = (v) => (H - 28) - ((v - lo) / (hi - lo || 1)) * (H - 28 - 14);
    const right = W - 60; const n = rows.length;
    const x = (i) => left + 10 + (n > 1 ? i * (right - left - 10) / (n - 1) : 0);
    tk.forEach((t) => { svg.append(s('line', { x1: left, x2: W - 4, y1: y(t), y2: y(t), stroke: t === 0 ? 'var(--muted)' : 'var(--line)', 'stroke-width': t === 0 ? 1.5 : 1 })); const tx = s('text', { x: left - 6, y: y(t), dy: '0.32em', 'text-anchor': 'end', fill: 'var(--muted)', 'font-size': 12 }); tx.textContent = brl0.format(t); svg.append(tx); });
    const fim = vals[n - 1] || 0; const cor = fim < 0 ? 'var(--bad)' : 'var(--ok)';
    svg.append(s('path', { d: rows.map((d, i) => (i ? 'L' : 'M') + x(i) + ',' + y(d.acumulado || 0)).join(''), fill: 'none', stroke: cor, 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    const passo = n > 1 ? (right - left - 10) / (n - 1) : W;
    const every = Math.max(1, Math.ceil(72 / passo));
    const pontos = [];
    rows.forEach((d, i) => {
      svg.append(s('circle', { cx: x(i), cy: y(d.acumulado || 0), r: 3.5, fill: cor }));
      if (i % every === 0) { const tx = s('text', { x: x(i), y: H - 8, 'text-anchor': 'middle', fill: 'var(--muted)', 'font-size': 12 }); tx.textContent = d.mes; svg.append(tx); }
      pontos.push({ x: x(i) - passo / 2, w: passo, d });
    });
    if (n) { const tx = s('text', { x: x(n - 1) + 6, y: y(fim), dy: '0.32em', fill: cor, 'font-size': 12, 'font-weight': 600 }); tx.textContent = brl0.format(fim); svg.append(tx); }
    tooltip(box, svg, W, H, pontos, (d) => [['Receita', d.receita], ['Contas', d.total], ['Saldo do mês', d.saldo], ['Acumulado', d.acumulado]]);
  }
})();
